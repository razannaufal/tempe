name: Release Tempe CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix tempe-cli
      - run: npm run build:windows --prefix tempe-cli
      - name: Smoke test Windows executable
        shell: pwsh
        run: .\tempe-cli\dist\tempe.exe --help
      - name: Package Windows executable
        shell: pwsh
        run: |
          $archive = "tempe-cli\dist\tempe-${{ github.ref_name }}-windows-x64.zip"
          Compress-Archive -Path tempe-cli\dist\tempe.exe -DestinationPath $archive
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: tempe-cli/dist/tempe-${{ github.ref_name }}-windows-x64.zip

  npm-publish:
    if: ${{ vars.PUBLISH_NPM == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Verify release tag matches package version
        working-directory: tempe-cli
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const version = require('./package.json').version; if (process.env.RELEASE_TAG !== 'v' + version) { throw new Error('Tag must match package version: v' + version); }"
      - run: npm ci
        working-directory: tempe-cli
      - run: npm publish --access public
        working-directory: tempe-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
